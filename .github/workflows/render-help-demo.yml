name: render-help-demo

# Keep the README's animated `unmux --help` demo in sync with the real CLI.
# On pushes to main that could change the help text, rebuild unmux, diff its
# --help against the committed snapshot, and if it changed, re-render the demo
# and open a PR with the new asset for review.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/img/make-help-demo.sh'
      - '.github/workflows/render-help-demo.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-help-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build unmux
        run: cargo build --release

      - name: Detect whether --help changed
        id: diff
        run: |
          NO_COLOR=1 ./target/release/unmux --help > /tmp/help.new
          if [ -f .github/img/help.txt ] && diff -q /tmp/help.new .github/img/help.txt > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::unmux --help is unchanged; skipping demo re-render."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::unmux --help changed; re-rendering the demo."
          fi

      - name: Install render tools
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # ttyd + ImageMagick, plus the shared libraries VHS's headless Chromium needs.
          sudo apt-get install -y ttyd imagemagick \
            fonts-liberation libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdrm2 libgbm1 libgtk-3-0 libasound2t64 libxkbcommon0 libxdamage1 \
            libxfixes3 libxrandr2 libxcomposite1 libpango-1.0-0
          # ffmpeg with the libsvtav1 (AV1) encoder, via the BtbN static build.
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
          # vhs, pinned to match what the demo was authored against.
          VHS=0.11.0
          curl -fsSL -o /tmp/vhs.tar.gz \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS}/vhs_${VHS}_Linux_x86_64.tar.gz"
          tar -xf /tmp/vhs.tar.gz -C /tmp
          sudo cp "$(find /tmp -name vhs -type f | head -1)" /usr/local/bin/vhs
          ffmpeg -version | head -1
          vhs --version

      - name: Render demo
        if: steps.diff.outputs.changed == 'true'
        env:
          UNMUX_BIN: ${{ github.workspace }}/target/release/unmux
        run: bash .github/img/make-help-demo.sh

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/help-demo
          delete-branch: true
          title: 'docs: refresh the animated --help demo'
          commit-message: 'docs: refresh the animated --help demo'
          body: |
            `unmux --help` changed, so the animated demo in the README
            (`.github/img/help.avif`) was regenerated to match.

            Auto-generated by the `render-help-demo` workflow. Review the
            demo, then merge to update the README.
          add-paths: |
            .github/img/help.avif
            .github/img/help.txt
