name: render-help-demo

# Keep the README's animated `unmux --help` demo in sync with the real CLI.
# On pushes to main that could change the help text, rebuild unmux, diff its
# --help against the committed snapshot, and if it changed, re-render the demo
# and commit the new asset straight to main as github-actions[bot]. Pushes made
# with GITHUB_TOKEN do not trigger workflow runs, so the commit cannot loop.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/img/make-help-demo.sh'
      - '.github/workflows/render-help-demo.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-help-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # ubuntu-latest is x86_64, where AVX2 is not enabled by default, so sassy's `ensure_simd`
      # release gate aborts a flag-less `cargo build --release`. x86-64-v3 (AVX2) is guaranteed on
      # every GitHub ubuntu runner and stays portable across runner generations, matching how the CI
      # workflow builds. `--help` is identical across the SIMD and scalar backends, so this keeps the
      # rendered demo built from the real shipped binary.
      RUSTFLAGS: "-C target-cpu=x86-64-v3"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build unmux
        run: cargo build --release

      - name: Detect whether --help changed
        id: diff
        run: |
          NO_COLOR=1 ./target/release/unmux --help > /tmp/help.new
          if [ -f .github/img/help.txt ] && diff -q /tmp/help.new .github/img/help.txt > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::unmux --help is unchanged; skipping demo re-render."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::unmux --help changed; re-rendering the demo."
          fi

      - name: Install render tools
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # ttyd, zsh (the tape's shell) and ImageMagick, plus the shared libraries VHS's headless Chromium needs.
          sudo apt-get install -y ttyd zsh imagemagick \
            fonts-liberation libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdrm2 libgbm1 libgtk-3-0 libasound2t64 libxkbcommon0 libxdamage1 \
            libxfixes3 libxrandr2 libxcomposite1 libpango-1.0-0
          # ffmpeg with the libsvtav1 (AV1) encoder, via the BtbN static build.
          curl -fsSL -o /tmp/ffmpeg.tar.xz \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-*-linux64-gpl/bin/ffmpeg /usr/local/bin/ffmpeg
          # vhs, pinned to match what the demo was authored against.
          VHS=0.11.0
          curl -fsSL -o /tmp/vhs.tar.gz \
            "https://github.com/charmbracelet/vhs/releases/download/v${VHS}/vhs_${VHS}_Linux_x86_64.tar.gz"
          tar -xf /tmp/vhs.tar.gz -C /tmp
          sudo cp "$(find /tmp -name vhs -type f | head -1)" /usr/local/bin/vhs
          ffmpeg -version | head -1
          vhs --version

      - name: Render demo
        if: steps.diff.outputs.changed == 'true'
        env:
          UNMUX_BIN: ${{ github.workspace }}/target/release/unmux
        run: bash .github/img/make-help-demo.sh

      - name: Commit the refreshed demo to main
        if: steps.diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/img/help.avif .github/img/help.txt
          if git diff --cached --quiet; then
            echo "::notice::The rendered demo already matches main; nothing to commit."
            exit 0
          fi
          git commit -m 'docs: refresh the animated --help demo'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Replay onto main in case it advanced during the render; a newer --help change cancels this run instead.
          git fetch "$remote" main
          git rebase FETCH_HEAD
          git push "$remote" HEAD:main
